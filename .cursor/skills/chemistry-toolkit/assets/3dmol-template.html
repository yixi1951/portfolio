<!-- Minimal 3Dmol.js viewer template.
     Copy this into an HTML artifact. Replace the CID or model block in the marked spot.
     Three loading strategies are shown (uncomment the one you want). -->
<div id="viewer" style="width: 100%; height: 500px; position: relative; border: 1px solid #ddd; border-radius: 8px;"></div>
<div style="margin-top: 8px; font-family: system-ui, sans-serif; font-size: 13px; color: #555;">
  Drag to rotate · scroll/pinch to zoom · right-click drag to pan
</div>

<script src="https://3dmol.org/build/3Dmol-min.js"></script>
<script>
  const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "white" });

  // ============================================================
  // STRATEGY A — Load by PubChem CID (easiest for known compounds)
  // Find the CID at https://pubchem.ncbi.nlm.nih.gov/  (e.g. aspirin = 2244)
  // ============================================================
  $3Dmol.download("cid:2244", viewer, {}, () => {
    viewer.setStyle({}, { stick: { radius: 0.15 }, sphere: { scale: 0.25 } });
    viewer.zoomTo();
    viewer.render();
  });

  // ============================================================
